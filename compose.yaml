services:
  # ---------------------------------------------------------------------
  # MySQL. Data lives in the db-data named volume so it survives
  # redeploys (DP6). Not published to the host: only app reaches it.
  # ---------------------------------------------------------------------
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rgv}
      MYSQL_USER: ${DB_USERNAME:-rgv}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rgv_local_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rgv_root_password}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${DB_USERNAME:-rgv} -p${DB_PASSWORD:-rgv_local_password} --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - backend

  # ---------------------------------------------------------------------
  # Laravel: serves the versioned REST API and the existing Blade portal.
  # ---------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rgv-system-app:${APP_COMMIT:-local}
    env_file: Backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_COMMIT: ${APP_COMMIT:-}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-rgv}
      DB_USERNAME: ${DB_USERNAME:-rgv}
      DB_PASSWORD: ${DB_PASSWORD:-rgv_local_password}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - backend

  # ---------------------------------------------------------------------
  # SPA client (REST-only). Built as static files and served by nginx.
  # ---------------------------------------------------------------------
  web:
    build:
      context: ./Frontend/app
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - app
    networks:
      - backend

  # ---------------------------------------------------------------------
  # Reverse proxy. The only service that publishes host ports.
  # Routes /api and the existing portal prefixes to app, everything else
  # to the SPA (see deploy/Caddyfile).
  # ---------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    depends_on:
      - app
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - backend

  # ---------------------------------------------------------------------
  # Local Ollama for the AI integration (T1-T3).
  # ---------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    networks:
      - backend

  # ---------------------------------------------------------------------
  # Public HTTPS address via Cloudflare Tunnel (rubric hosting option A).
  # Opt-in: `docker compose --profile tunnel up -d`.
  # ---------------------------------------------------------------------
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    profiles:
      - tunnel
    depends_on:
      - caddy
    networks:
      - backend

volumes:
  db-data:
  app_storage:
  app_logs:
  ollama_models:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
