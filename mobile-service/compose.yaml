services:
  mobile-api:
    build: .
    env_file: .env
    environment:
      DB_SSLMODE: ${DB_SSLMODE:-verify-full}
    ports:
      - "127.0.0.1:${MOBILE_API_PORT:-8081}:8081"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - default

networks:
  default:
    name: rgv-mobile-api
    external: true
