openapi: 3.0.3
info:
  title: RGV System API
  version: 1.0.0
  description: API for public inventory lookup and authenticated employee mobile workflows. Authentication uses Laravel Sanctum bearer tokens.
servers:
  - url: /api
paths:
  /health:
    get:
      summary: Application and database health
      responses:
        '200':
          description: Application and database are available
        '503':
          description: Database is unavailable
  /docs:
    get:
      summary: OpenAPI specification
      responses:
        '200':
          description: This OpenAPI document in YAML format
  /inventories:
    get:
      summary: Public inventory list
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: category_id
          schema: { type: integer }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Cursor-paginated inventory records
  /v1/mobile/auth/login:
    post:
      summary: Sign in an active employee and issue a Sanctum token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string }
      responses:
        '200': { description: Token or MFA challenge }
        '422': { description: Invalid credentials or validation failure }
        '429': { description: Login rate limit exceeded }
  /v1/mobile/auth/mfa/verify:
    post:
      summary: Complete a pending employee MFA challenge
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Employee token issued }
        '403': { description: Invalid or missing MFA challenge }
  /v1/mobile/me:
    get:
      summary: Current employee profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Authenticated employee profile }
        '401': { description: Unauthenticated }
  /v1/mobile/dashboard:
    get:
      summary: Employee borrow dashboard
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Employee summary and recent requests }
  /v1/mobile/inventory/lookup:
    get:
      summary: Resolve inventory QR payload or code
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
      responses:
        '200': { description: Inventory record }
        '422': { description: No matching inventory record }
  /v1/mobile/inventory/search:
    get:
      summary: Search active inventory
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200': { description: Matching inventory records }
  /v1/mobile/borrow-requests:
    get:
      summary: List current employee borrow requests
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Borrow requests }
    post:
      summary: Create borrow request
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
          description: Reuse the same key when retrying the same request after a network failure.
      responses:
        '201': { description: Created borrow request }
        '409': { description: Inventory is no longer available }
        '422': { description: Validation failure }
  /v1/mobile/borrow-requests/{borrowRequest}/cancel:
    post:
      summary: Cancel own pending borrow request
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: borrowRequest
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Request cancelled }
        '403': { description: Request belongs to another employee }
        '409': { description: Request cannot be cancelled in current state }
  /v1/mobile/borrow-requests/{borrowRequest}/return:
    post:
      summary: Return items from own borrow request
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: borrowRequest
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Items returned }
        '403': { description: Request belongs to another employee }
        '422': { description: Validation failure }
  /v1/mobile/profile:
    patch:
      summary: Update employee profile
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Updated employee profile }
  /v1/mobile/password:
    put:
      summary: Change employee password
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Password updated }
        '422': { description: Validation failure }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
