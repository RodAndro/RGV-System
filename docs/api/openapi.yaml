components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: 'Field to sort by. Prefix with `-` for descending.'
      schema:
        type: string
        example: '-created_at'
    Search:
      name: q
      in: query
      description: "Free-text search across the resource's searchable fields."
      schema:
        type: string
  responses:
    Unauthenticated:
      description: 'Missing or invalid bearer token'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              message: 'Authentication is required.'
              details: {  }
    Forbidden:
      description: 'Authenticated but not permitted'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: 'You do not have permission to perform this action.'
              details: {  }
    NotFound:
      description: 'Resource does not exist'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: 'The requested resource does not exist.'
              details: {  }
    ValidationError:
      description: 'Validation failed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: 'Some fields are invalid.'
              details:
                -
                  field: email
                  message: 'Must be a valid email address.'
    RateLimited:
      description: 'Too many requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: 'Too many requests. Please try again later.'
              details: {  }
  schemas:
    AiReport:
      type: object
      properties:
        report:
          type: string
          enum:
            - insights
            - forecast
            - inventory-recommendations
        generated_text:
          type: string
          description: 'Model answer, or a deterministic summary when the model is unavailable.'
        source:
          type: string
          enum:
            - model
            - deterministic-fallback
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: 'Advisory score; 0 when a deterministic fallback was used.'
        confidence_note:
          type: string
        model:
          type: string
          nullable: true
        response_time_ms:
          type: integer
        disclosure:
          type: string
          description: 'Machine-generated advisory notice shown to users.'
        inputs:
          type: object
          description: 'The aggregate data the answer was based on.'
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    Meta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    Health:
      type: object
      properties:
        status:
