name: CI and deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_pgsql, pdo_sqlite, simplexml, xml, xmlreader, xmlwriter, zip
          coverage: pcov
          tools: composer:v2
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Check PHP syntax
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check changed PHP style
        run: >-
          vendor/bin/pint --test
          app/Http/Controllers/Admin/UserController.php
          app/Http/Controllers/Api/Mobile/AuthController.php
          app/Http/Controllers/Api/Mobile/BorrowRequestController.php
          app/Http/Controllers/ChatbotController.php
          app/Http/Middleware/LogApiRequest.php
          app/Http/Middleware/RequireTokenAbility.php
          app/Models/ChatbotInteraction.php
          app/Models/AuditLog.php
          app/Services/DatabaseRetrievalService.php
          app/Services/AuditLogger.php
          app/Services/OllamaService.php
          bootstrap/app.php config/app.php config/services.php routes/api.php
          database/migrations/2026_11_11_000001_create_chatbot_interactions_table.php
          tests/Feature/ApiHealthTest.php tests/Feature/ChatbotTest.php
          tests/Feature/Auth/AuthenticationTest.php tests/Feature/PlatformFeaturesTest.php
      - name: Run backend tests and coverage gate
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --coverage --min=60

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare Compose validation environment
        run: cp .env.example .env
      - name: Validate Docker Compose configuration
        env:
          DB_PASSWORD: ci-only-compose-validation
          APP_COMMIT: ci-validation
          APP_DOMAIN: localhost
        run: docker compose config --quiet
      - name: Build production container
        run: docker build --tag rgv-system-app:ci .

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  mobile-service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rgv_mobile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rgv_mobile_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mobile-service/requirements-dev.txt
      - name: Install service test dependencies
        run: python -m pip install -r mobile-service/requirements-dev.txt
      - name: Test independent mobile service with PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rgv_mobile_test
        run: pytest -q
        working-directory: mobile-service
      - name: Build independent mobile service container
        run: docker build --tag rgv-mobile-service:ci mobile-service

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, mobile, mobile-service]
    runs-on: [self-hosted, linux, rgv-production]
    environment: production
    concurrency:
      group: rgv-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Deploy services and migrate safely
        env:
          APP_COMMIT: ${{ github.sha }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          MOBILE_DB_HOST: ${{ secrets.MOBILE_DB_HOST }}
          MOBILE_DB_PORT: ${{ secrets.MOBILE_DB_PORT }}
          MOBILE_DB_NAME: ${{ secrets.MOBILE_DB_NAME }}
          MOBILE_DB_USER: ${{ secrets.MOBILE_DB_USER }}
          MOBILE_DB_PASSWORD: ${{ secrets.MOBILE_DB_PASSWORD }}
          AUDIT_HMAC_KEY: ${{ secrets.AUDIT_HMAC_KEY }}
          MOBILE_MAIL_HOST: ${{ secrets.MOBILE_MAIL_HOST }}
          MOBILE_MAIL_PORT: ${{ secrets.MOBILE_MAIL_PORT }}
          MOBILE_MAIL_USERNAME: ${{ secrets.MOBILE_MAIL_USERNAME }}
          MOBILE_MAIL_PASSWORD: ${{ secrets.MOBILE_MAIL_PASSWORD }}
          ADMIN_NOTIFICATION_EMAIL: ${{ secrets.ADMIN_NOTIFICATION_EMAIL }}
        run: |
          umask 077
          : "${MOBILE_DB_USER:?Set MOBILE_DB_USER to the PostgreSQL role username from Supabase Connect}"
          {
            printf '%s\n' "DB_HOST=$MOBILE_DB_HOST"
            printf '%s\n' "DB_PORT=${MOBILE_DB_PORT:-5432}"
            printf '%s\n' "DB_NAME=$MOBILE_DB_NAME"
            printf '%s\n' "DB_USER=$MOBILE_DB_USER"
            printf '%s\n' "DB_PASSWORD=$MOBILE_DB_PASSWORD"
            printf '%s\n' "DB_SSLMODE=verify-full"
            printf '%s\n' "AUDIT_HMAC_KEY=$AUDIT_HMAC_KEY"
            printf '%s\n' "APP_TIMEZONE=UTC"
            printf '%s\n' "APP_URL=https://$APP_DOMAIN"
            printf '%s\n' "MAIL_HOST=$MOBILE_MAIL_HOST"
            printf '%s\n' "MAIL_PORT=${MOBILE_MAIL_PORT:-587}"
            printf '%s\n' "MAIL_USERNAME=$MOBILE_MAIL_USERNAME"
            printf '%s\n' "MAIL_PASSWORD=$MOBILE_MAIL_PASSWORD"
            printf '%s\n' "ADMIN_NOTIFICATION_EMAIL=$ADMIN_NOTIFICATION_EMAIL"
          } > mobile-service/.env
          docker compose config -q
          docker compose up -d --build --remove-orphans
          docker compose exec -T app php artisan migrate --force
          docker compose -f mobile-service/compose.yaml config -q
          docker compose -f mobile-service/compose.yaml up -d --build
      - name: Verify standalone mobile service
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          set -eu
          url="https://${APP_DOMAIN}/api/v1/mobile/health"
          attempt=0
          until payload="$(curl --silent --show-error --fail "$url")"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 12 ]; then
              docker compose -f mobile-service/compose.yaml logs --tail=200 mobile-api
              exit 1
            fi
            sleep 5
          done
          printf '%s' "$payload" | jq -e '.status == "ok"'
      - name: Verify deployed commit and health
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          APP_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          url="https://${APP_DOMAIN}/api/health"
          attempt=0
          until payload="$(curl --silent --show-error --fail "$url")"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 12 ]; then
              docker compose logs --tail=200 app caddy ollama
              exit 1
            fi
            sleep 10
          done
          printf '%s' "$payload" | jq -e --arg commit "$APP_COMMIT" '.status == "ok" and .commit == $commit'
